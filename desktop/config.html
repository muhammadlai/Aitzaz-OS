<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aitzaz AI Pro — Connect</title>
  <style>
    :root {
      --bg: #050b14;
      --panel: #081321;
      --cyan: #35e0ff;
      --cyan-dim: #14a7c4;
      --text: #d7f6ff;
      --muted: #7fa7b8;
      --danger: #ff5d6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: radial-gradient(1200px 700px at 50% -10%, #0a1a30 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .card { width: 100%; }
    .brand { text-align: center; margin-bottom: 26px; }
    .ring {
      width: 92px; height: 92px; margin: 0 auto 16px;
      border-radius: 50%;
      border: 2px solid var(--cyan-dim);
      box-shadow: 0 0 18px var(--cyan-dim), inset 0 0 18px rgba(53,224,255,.25);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2.6s ease-in-out infinite;
    }
    .ring::after {
      content: ""; width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle, #eaffff 0%, var(--cyan) 45%, rgba(53,224,255,0) 72%);
      box-shadow: 0 0 22px var(--cyan);
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: 2px; font-weight: 600; }
    .tag { color: var(--muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
    label { display: block; font-size: 12px; letter-spacing: 2px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; }
    input[type="text"] {
      width: 100%; padding: 13px 14px; border-radius: 10px;
      border: 1px solid var(--cyan-dim);
      background: #06101c; color: var(--text); font-size: 15px; outline: none;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    input[type="text"]:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(53,224,255,.15); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .hint code { color: var(--cyan); background: #0a1a2c; padding: 1px 6px; border-radius: 5px; }
    button {
      margin-top: 22px; width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, #0c7d99, var(--cyan-dim));
      color: #04121c; font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    button:hover { filter: brightness(1.15); }
    button:active { transform: translateY(1px); }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; text-align: center; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="ring"></div>
      <h1>AITZAZ AI PRO</h1>
      <div class="tag">Desktop shell — connect to your server</div>
    </div>

    <label for="url">Server address</label>
    <input
      id="url"
      type="text"
      spellcheck="false"
      placeholder="https://192.168.1.20  or  https://jarvis.local"
      autocomplete="off"
    />
    <div class="hint">
      Yeh wohi address hai jo Aitzaz server chalane wali machine ka hai — HUD
      ka <code>/hud/</code> apne aap lag jayega. Example:
      <code>https://192.168.1.20</code>
    </div>

    <button id="connect">CONNECT</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };

    async function boot() {
      try {
        const cfg = await window.aitzaz.getConfig();
        if (cfg && cfg.url) $('url').value = cfg.url;
      } catch {}
      $('url').focus();
      $('url').select();
    }

    $('connect').onclick = async () => {
      const raw = $('url').value.trim();
      if (!raw) { msg('Pehle server address likho.', 'err'); return; }
      const res = await window.aitzaz.connect(raw);
      if (res && res.url) msg('Connecting…', 'ok');
    };

    $('url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('connect').click();
    });

    boot();
  </script>
</body>
</html>
