name: Build Aitzaz AI Pro desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run build
            artifact: Aitzaz-AI-Pro-Linux-*
          - os: windows-latest
            cmd: npm run build
            artifact: Aitzaz-AI-Pro-Windows-*
          - os: macos-latest
            cmd: npm run build
            artifact: Aitzaz-AI-Pro-Mac-*
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # skip code signing
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npm run rebuild

      - name: Create empty app-config (Google OAuth placeholders)
        working-directory: app
        run: echo '{"VITE_GOOGLE_CLIENT_ID":"","VITE_GOOGLE_CLIENT_SECRET":""}' > app-config.json

      - name: Build installers (Go backend + Vite + electron-builder)
        working-directory: app
        run: ${{ matrix.cmd }} --publish never

      - name: Collect artifacts
        shell: bash
        working-directory: app
        run: |
          mkdir -p dist-artifacts
          find release -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/dist-artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
